process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9094

listeners=PLAINTEXT://:9092,SASL_PLAINTEXT://:9093,HOST_PLAINTEXT://:19092,HOST_SASL_PLAINTEXT://:19093,CONTROLLER://:9094
advertised.listeners=PLAINTEXT://kafka:9092,SASL_PLAINTEXT://kafka:9093,HOST_PLAINTEXT://localhost:19092,HOST_SASL_PLAINTEXT://localhost:19093
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,HOST_PLAINTEXT:PLAINTEXT,HOST_SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT

offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0

# Enable SASL mechanisms for SASL_PLAINTEXT listener.
# - SCRAM is used by dynamic roles and static SCRAM rotation examples.
# - PLAIN is used by the static app_plain role example.
sasl.enabled.mechanisms=SCRAM-SHA-256,PLAIN
listener.name.sasl_plaintext.sasl.enabled.mechanisms=SCRAM-SHA-256,PLAIN
listener.name.sasl_plaintext.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasl_plaintext.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_my-user="my-pass";

# Enable SASL mechanisms for HOST_SASL_PLAINTEXT listener (clients on Docker host).
listener.name.host_sasl_plaintext.sasl.enabled.mechanisms=SCRAM-SHA-256,PLAIN
listener.name.host_sasl_plaintext.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.host_sasl_plaintext.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_my-user="my-pass";

# Enable ACL APIs (KRaft).
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=true

