services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092" # PLAINTEXT admin/init
      - "9093:9093" # SASL_PLAINTEXT client
      - "19092:19092" # HOST_PLAINTEXT (for clients on the Docker host)
      - "19093:19093" # HOST_SASL_PLAINTEXT (for clients on the Docker host)
    volumes:
      - ./kafka/config:/mnt/shared/config:ro

  kafka-init:
    image: apache/kafka:4.2.0
    container_name: kafka-init
    depends_on:
      - kafka
    working_dir: /opt/kafka/bin
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic test-topic --partitions 1 --replication-factor 1
        # Create a SCRAM user used by the static rotation demo role (app_scram).
        ./kafka-configs.sh --bootstrap-server kafka:9092 --alter \
          --add-config "SCRAM-SHA-256=[iterations=4096,password=static-initial-pass]" \
          --entity-type users --entity-name static_user >/dev/null 2>&1 || true
        # Since ACL authorizer is enabled, once any ACL exists the broker requires explicit ACLs per principal.
        # Grant test-topic RW to the static demo principals.
        ./kafka-acls.sh --bootstrap-server kafka:9092 --add \
          --allow-principal "User:my-user" \
          --operation Read --operation Write --operation Describe \
          --topic test-topic >/dev/null 2>&1 || true
        ./kafka-acls.sh --bootstrap-server kafka:9092 --add \
          --allow-principal "User:static_user" \
          --operation Read --operation Write --operation Describe \
          --topic test-topic >/dev/null 2>&1 || true
        echo "kafka-init done"
        # Keep container running so `docker compose up --abort-on-container-exit` doesn't stop the stack early.
        sleep 1000000
    restart: "no"

  vault:
    image: hashicorp/vault:1.21
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: info
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/plugins:/vault/plugins:ro
    command: ["server", "-dev", "-dev-plugin-dir=/vault/plugins"]

  vault-init:
    image: hashicorp/vault:1.21
    container_name: vault-init
    depends_on:
      - vault
      - kafka-init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      PLUGIN_NAME: vault-plugin-secrets-kafka
      PLUGIN_PATH: /vault/plugins/vault-plugin-secrets-kafka
      APPROLE_OUT_DIR: /out
    volumes:
      - ./vault/plugins:/vault/plugins:ro
      - ./vault/init.sh:/init.sh:ro
      - spring-app-secrets:/out
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sh /init.sh
        # Keep container running so `docker compose up --abort-on-container-exit` doesn't stop the stack early.
        sleep 1000000
    restart: "no"

  spring-app:
    build:
      context: ../spring-boot-testapp
    container_name: spring-app
    ports:
      - "8080:8080"
    depends_on:
      - vault
      - kafka
      - vault-init
      - kafka-init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_KAFKA_ROLE: ci
      TEST_TOPIC: test-topic
    volumes:
      - spring-app-secrets:/etc/config/vault-approle:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        echo "Waiting for vault-init ready marker..."
        until [ -s /etc/config/vault-approle/ready ] && [ -s /etc/config/vault-approle/token ]; do
          sleep 0.2
        done
        exec java -jar /app/app.jar
    restart: "no"

volumes:
  spring-app-secrets: {}
