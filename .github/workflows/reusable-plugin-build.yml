# Reusable: run tests on the runner (linux/amd64) and cross-compile the plugin binary.
name: Reusable plugin build

on:
  workflow_call:
    inputs:
      plugin:
        description: Plugin directory name under plugins/ (e.g. vault-plugin-secrets-kafka)
        required: true
        type: string
      goos:
        required: true
        type: string
      goarch:
        required: true
        type: string

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/go-plugin-build
        with:
          plugin: ${{ inputs.plugin }}
          goos: ${{ inputs.goos }}
          goarch: ${{ inputs.goarch }}
          output: ${{ runner.temp }}/plugin-binary
